# pg_hba.conf for the isolated test container only (docker-compose.test.yml).
# Mounted read-only and selected with -c hba_file. The development container
# keeps its own, unchanged configuration.
#
# The first matching line wins. Connections that match no line are rejected,
# including every replication connection ("all" does not match the
# "replication" keyword).
#
# TYPE  DATABASE          USER                          ADDRESS  METHOD

# Test LOGIN role (provisioned in a later step): SCRAM over TCP into
# careerpilot_test only. These lines come before the trust line below, so
# the role can use neither the socket nor any other database. They are
# harmless while the role does not exist.
local   all               careerpilot_test_demo_login            reject
host    careerpilot_test  careerpilot_test_demo_login   all      scram-sha-256
host    all               careerpilot_test_demo_login   all      reject

# Container-internal Unix socket: trust. The image's initialization connects
# here with psql --no-password to create the database and run the init
# scripts. Only processes inside the container (docker exec) can reach it.
local   all               all                                    trust

# Everyone else over TCP (the published port and the healthcheck): SCRAM.
host    all               all                           all      scram-sha-256
