
openapi: 3.0.3

info:
  title: CareerPilot API
  version: 1.0.0
  description: |
    REST API for the CareerPilot job application tracking
    and resume matching platform.

    In public_demo mode (CAREERPILOT_MODE=public_demo) every endpoint
    except /health is rate limited (HTTP 429 with Retry-After), request
    bodies larger than 262144 bytes are refused (HTTP 413), and writes are
    refused (HTTP 403). None of these responses occur in local mode.

servers:
  - url: http://localhost:8000

tags:
  - name: Health
  - name: Applications
  - name: Dashboard
  - name: Resume Matching

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /config:
    get:
      tags: [Health]
      operationId: getConfig
      summary: Report the operating mode
      description: |
        Lets the frontend hide write actions in the read-only public demo.
        Informational only; the backend enforces read-only mode itself.
      responses:
        '200':
          description: Active operating mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /version:
    get:
      tags: [Health]
      operationId: getVersion
      summary: Report the deployed commit
      description: |
        The commit SHA of the running release (RENDER_GIT_COMMIT on Render),
        or null when it is unknown. Used by the release smoke test.
      responses:
        '200':
          description: Deployed commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List and filter job applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create a job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/ValidationError'

  /applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get a job application
      responses:
        '200':
          description: Application found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update a job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Delete a job application
      responses:
        '204':
          description: Application deleted
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get application statistics and upcoming interviews
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /resume/match:
    post:
      tags: [Resume Matching]
      operationId: matchResume
      summary: Compare resume text with a job description
      description: |
        Returns a deterministic heuristic match score.
        Submitted resume text is not stored by the matching service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeMatchRequest'
      responses:
        '200':
          description: Resume matching results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeMatchResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    VersionResponse:
      type: object
      required: [commit]
      properties:
        commit:
          type: string
          pattern: '^[0-9a-f]{40}$'
          nullable: true

    ConfigResponse:
      type: object
      required: [mode, read_only]
      properties:
        mode:
          type: string
          enum: [local, public_demo]
        read_only:
          type: boolean

    ApplicationStatus:
      type: string
      enum:
        - Saved
        - Applied
        - Interview
        - Offer
        - Rejected

    ApplicationCreate:
      type: object
      required:
        - company_name
        - job_title
        - application_date
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
        job_title:
          type: string
          minLength: 1
          maxLength: 200
        job_description:
          type: string
          nullable: true
        application_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        job_url:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true
        interview_at:
          type: string
          format: date-time
          nullable: true
        interview_notes:
          type: string
          nullable: true

    ApplicationUpdate:
      type: object
      description: Partial update. Supply at least one field.
      minProperties: 1
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
        job_title:
          type: string
          minLength: 1
          maxLength: 200
        job_description:
          type: string
          nullable: true
        application_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        job_url:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true
        interview_at:
          type: string
          format: date-time
          nullable: true
        interview_notes:
          type: string
          nullable: true

    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationCreate'
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    DashboardResponse:
      type: object
      required: [total, by_status, upcoming_interviews, recent_applications]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        upcoming_interviews:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        recent_applications:
          type: array
          items:
            $ref: '#/components/schemas/Application'

    ResumeMatchRequest:
      type: object
      required: [resume_text, job_description]
      properties:
        resume_text:
          type: string
          minLength: 1
          maxLength: 20000
        job_description:
          type: string
          minLength: 1
          maxLength: 20000

    ResumeMatchResponse:
      type: object
      required: [score, matched_keywords, missing_keywords, suggestions]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Heuristic keyword match score, not a hiring prediction
        matched_keywords:
          type: array
          items:
            type: string
        missing_keywords:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

  responses:
    TooManyRequests:
      description: |
        public_demo rate limit reached; retry after the number of seconds
        in the Retry-After header. Never returned in local mode.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PayloadTooLarge:
      description: |
        public_demo request body exceeds 262144 bytes. Never returned in
        local mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ReadOnly:
      description: |
        The server is running in read-only public_demo mode
        (CAREERPILOT_MODE=public_demo). Writes are disabled; in local
        mode this response is never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Requested application was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  additionalProperties: true
