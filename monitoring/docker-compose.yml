name: careerpilot-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: "no"

  tempo:
    image: grafana/tempo:2.10.8
    command:
      - --config.file=/etc/tempo.yml
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: "no"

  loki:
    image: grafana/loki:3.7.8
    command:
      - --config.file=/etc/loki.yml
    volumes:
      - ./loki.yml:/etc/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otel-collector.yml
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - tempo
      - loki
    restart: "no"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: "no"

volumes:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
