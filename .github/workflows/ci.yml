name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml, so a deploy runs exactly these checks first.
  workflow_call:

# Read-only token: this workflow never writes to the repository,
# publishes packages, or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fixed, non-secret credentials of the isolated, disposable test
      # container in docker-compose.test.yml (the same container local runs
      # use through ops/test-backend.ps1). Not production values.
      POSTGRES_USER: careerpilot_test_admin
      POSTGRES_PASSWORD: careerpilot_test_admin_password
      POSTGRES_DB: careerpilot_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      # PostgreSQL 16 with the test-only pg_hba.conf, on 127.0.0.1:5433. On
      # its fresh (tmpfs) start the image creates careerpilot_test, owned by
      # the test superuser, and runs the two mounted Stage A scripts, 01 and
      # 02, which provision the SELECT-only NOLOGIN careerpilot_test_reader
      # used by test_test_reader_role.py. Any script error stops the
      # container before it becomes healthy, so --wait fails this step.
      - name: Start isolated test PostgreSQL
        run: docker compose -p careerpilot-test -f docker-compose.test.yml up --detach --wait

      # Run from the repository root with "python -m" so the "backend"
      # package is importable (there is no backend/__init__.py).
      - name: Run pytest
        run: python -m pytest backend/tests -v

      # Server logs only (statement logging is off by default). They contain
      # no secrets; the credentials above are fixed test values.
      - name: Show test PostgreSQL logs
        if: failure()
        run: docker compose -p careerpilot-test -f docker-compose.test.yml logs db-test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest with jsdom and a mocked fetch: no backend or network needed.
      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Guardrail hook, MCP server, custom agent, and skill/subagent definitions.
  # Standard library only: no dependencies, no network, no database.
  agent-extensions:
    name: Agent extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Guardrail hook tests
        run: python -m unittest discover -s agent-hooks/tests -v

      - name: MCP server tests
        run: python -m unittest discover -s mcp-server/tests -v

      - name: Custom agent tests
        run: python -m unittest discover -s custom-agent/tests -v

      - name: Skill, subagent, and wiring checks
        run: python -m unittest discover -s .agents/tests -v

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # docker-compose.yml requires these variables; dummy values are used
      # only to validate the file. No containers are started.
      - name: Validate docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: docker compose config --quiet

      # Images are built locally on the runner and never pushed.
      - name: Build backend image
        run: docker build --tag careerpilot-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag careerpilot-frontend:ci ./frontend
